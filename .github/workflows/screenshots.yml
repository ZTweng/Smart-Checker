name: Capture platform screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build current application
        run: .\gradlew.bat :desktopApp:createDistributable --console=plain
      - name: Capture real application
        shell: pwsh
        run: ./script/windows-screenshots.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/*.png
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build application
        run: bash gradlew :androidApp:assembleDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash script/android-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: screenshots/*.png
          if-no-files-found: error
